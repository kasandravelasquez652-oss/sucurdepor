<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | APEX Performance</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>
  
  <div class="page-transition">
    <div class="loader-text">GEAR</div>
  </div>

  <div class="custom-cursor"></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand" style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--color-accent)"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/></svg>
        <h4 style="margin:0; font-size: 1.5rem; color: var(--color-text-primary);">APEX</h4>
      </a>
      <ul class="nav-links flex gap-8">
        <li><a href="catalogo.html" class="nav-link" style="color: var(--color-accent);">Gear</a></li>
        <li><a href="atletas.html" class="nav-link">Atletas</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding-top: var(--space-24);">
    <section class="section" style="padding-bottom: var(--space-8);">
      <div class="container">
        <h1 class="reveal-text"><span>EQUIPAMIENTO</span></h1>
        <h1 class="reveal-text delay-1" style="color: var(--color-surface); -webkit-text-stroke: 1px var(--color-text-primary);"><span>TÉCNICO</span></h1>
      </div>
    </section>

    <!-- Filtros -->
    <div class="container" style="margin-bottom: var(--space-8);">
      <div class="flex gap-4 fade-up delay-2">
        <button class="btn btn--outline" style="padding: 0.5rem 1.5rem; font-size: var(--text-sm);">Zapatillas</button>
        <button class="btn btn--outline" style="padding: 0.5rem 1.5rem; font-size: var(--text-sm);">Ropa</button>
        <button class="btn btn--outline" style="padding: 0.5rem 1.5rem; font-size: var(--text-sm);">Accesorios</button>
      </div>
    </div>

    <!-- Grid de Productos -->
    <section class="section" style="padding-top: 0;">
      <div class="container grid grid-cols-3 skew-scroll">
        
        <!-- Repeats of products -->
        <a href="#" class="product-card fade-up">
          <div class="product-card__image-wrapper">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=2070&auto=format&fit=crop" alt="Velocity" class="product-card__image">
          </div>
          <div class="product-card__info">
            <div>
              <h3 class="product-card__title">Velocity 1.0</h3>
              <span class="product-card__price">Running</span>
            </div>
            <span class="product-card__price">$180</span>
          </div>
        </a>

        <a href="#" class="product-card fade-up delay-1">
          <div class="product-card__image-wrapper">
            <img src="https://images.unsplash.com/photo-1556906781-9a412961c28c?q=80&w=1974&auto=format&fit=crop" alt="Titan" class="product-card__image">
          </div>
          <div class="product-card__info">
            <div>
              <h3 class="product-card__title">Titan X</h3>
              <span class="product-card__price">Crossfit</span>
            </div>
            <span class="product-card__price">$150</span>
          </div>
        </a>

        <a href="#" class="product-card fade-up delay-2">
          <div class="product-card__image-wrapper">
            <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?q=80&w=1974&auto=format&fit=crop" alt="Phantom" class="product-card__image">
          </div>
          <div class="product-card__info">
            <div>
              <h3 class="product-card__title">Phantom</h3>
              <span class="product-card__price">Training</span>
            </div>
            <span class="product-card__price">$140</span>
          </div>
        </a>
        
        <a href="#" class="product-card fade-up">
          <div class="product-card__image-wrapper">
            <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=1974&auto=format&fit=crop" alt="Volt" class="product-card__image">
          </div>
          <div class="product-card__info">
            <div>
              <h3 class="product-card__title">Volt Pro</h3>
              <span class="product-card__price">Track</span>
            </div>
            <span class="product-card__price">$200</span>
          </div>
        </a>

        <a href="#" class="product-card fade-up delay-1">
          <div class="product-card__image-wrapper">
             <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=2070&auto=format&fit=crop" alt="Velocity Black" class="product-card__image" style="filter: grayscale(100%);">
          </div>
          <div class="product-card__info">
            <div>
              <h3 class="product-card__title">Velocity Stealth</h3>
              <span class="product-card__price">Running</span>
            </div>
            <span class="product-card__price">$180</span>
          </div>
        </a>

      </div>
    </section>
  </main>

  <footer class="section" style="padding-bottom: var(--space-8); border-top: 1px solid var(--color-border);">
    <div class="container flex justify-between flex-col gap-8" style="flex-direction: column;">
      <h1 class="reveal-text" style="font-size: clamp(3rem, 15vw, 12rem); text-align: center; color: var(--color-surface);">APEX</h1>
      <div class="flex justify-between items-center" style="border-top: 1px solid var(--color-border); padding-top: var(--space-4); margin-top: var(--space-8);">
        <p class="fade-up" style="margin: 0; font-weight: 700;">&copy; 2026 APEX PERFORMANCE.</p>
        <div class="flex gap-4 fade-up">
          <a href="#" class="nav-link">Instagram</a>
          <a href="#" class="nav-link">Twitter</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
